name: Dart — pub get

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  get-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies (dart pub get)
        run: dart pub get
